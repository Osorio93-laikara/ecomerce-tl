<div class="contact-page">

    <!-- HERO -->
    <section class="contact-hero">

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <h1>Ami Prontu Hodi Ajuda</h1>

            <p>
                Iha Pergunta ka Necesidade? Kontaktu Ami! Ami Prontu Hodi Ajuda Ba Ita Nia Bo'ot Sira.
            </p>

        </div>

    </section>

    <!-- MAIN CONTENT -->
    <div class="contact-container">

        <!-- CONTACT INFO -->
        <div class="contact-info">

            <div class="info-card">
                <i class="fas fa-phone"></i>
                <div>
                    <h3>Phone</h3>
                    <p>+670 123 456 789</p>
                </div>
            </div>

            <div class="info-card">
                <i class="fas fa-envelope"></i>
                <div>
                    <h3>Email</h3>
                    <p>support&#64;shop.com</p>
                </div>
            </div>

            <div class="info-card">
                <i class="fas fa-location-dot"></i>
                <div>
                    <h3>Address</h3>
                    <p>Dili, Timor-Leste</p>
                </div>
            </div>

        </div>

        <!-- FORM -->
        <div class="contact-card">

            <h2>Send Message</h2>

            <p class="subtitle">Fill the form below and we’ll reply soon</p>

            <form>

                <div class="row">
                    <input type="text" placeholder="Your Name">
                    <input type="email" placeholder="Your Email">
                </div>

                <input type="text" placeholder="Subject">

                <textarea rows="6" placeholder="Write your message..."></textarea>

                <button type="submit">
                    <i class="fas fa-paper-plane"></i>
                    Send Message
                </button>

            </form>

        </div>

    </div>

</div>
